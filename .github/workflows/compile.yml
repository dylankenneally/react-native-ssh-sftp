# This workflow does a clean install of node dependencies, compiles the source
# from TypeScript to JavaScript, and runs the unit test suite with coverage.

name: Compile package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run compile
    - name: Run unit tests with coverage
      run: npm run test:coverage
    - name: Publish coverage to the run summary
      if: always()
      run: node .github/scripts/coverage-summary.mjs
