# Integration tests: stand up the OpenSSH fixture and run the Node smoke test
# against it. This is intentionally a separate workflow from `compile.yml` so that
# container flakiness never blocks the fast unit-test feedback loop.

name: Integration tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci

    - name: Start OpenSSH fixture
      run: docker compose -f test/integration/docker-compose.yml up -d

    # No explicit readiness wait: a port check passes the moment Docker publishes
    # the port, which is before sshd can authenticate. The smoke test retries
    # through the whole startup window (including auth-not-ready-yet) on its own.
    - name: Run integration smoke test
      run: npm run test:integration

    - name: Tear down OpenSSH fixture
      if: always()
      run: docker compose -f test/integration/docker-compose.yml down
